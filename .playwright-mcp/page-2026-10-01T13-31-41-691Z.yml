          - paragraph [ref=e321]: CRO 130.317
          - paragraph [ref=e322]: Dra. Nayara Melo é Cirurgiã-Dentista (CRO-SP 130.317), especialista em Prótese Dentária, com foco em Odontologia Digital, Reabilitação Oral e Estética. Iniciou sua trajetória na Odontologia em 2013 como protética e formou-se em Odontologia em 2018, reunindo experiência técnica e clínica no planejamento de tratamentos personalizados. Também atuou como Cirurgiã-Dentista concursada no serviço público e possui MBA em Gestão, Empreendedorismo e Negócios pela PUCRS. Sócia e fundadora da HAVEN CLINIC, alia precisão, tecnologia, gestão e atendimento humanizado para oferecer uma experiência segura e individualizada a cada paciente.
