<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Haven Clinic — Ultrassom Microfocado</title>
    <style>
      :root {
        --white-rock: #f1eee7;
        --puce: #79564d;
        --cashmere: #dec4ac;
        --puce-dark: #392824;
        --body: "Open Sans", Arial, sans-serif;
        --display: "The Seasons", Georgia, "Times New Roman", serif;
      }

      * { box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; margin: 0; overflow: hidden; }
      body { background: var(--white-rock); }

      .creative {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        isolation: isolate;
        background: var(--white-rock);
      }

      .portrait {
        position: absolute;
        z-index: 1;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .warm-wash {
        position: absolute;
        z-index: 2;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(241, 238, 231, .96) 0%, rgba(241, 238, 231, .86) 29%, rgba(241, 238, 231, .28) 53%, rgba(241, 238, 231, 0) 72%),
          linear-gradient(180deg, rgba(57, 40, 36, .20) 0%, rgba(57, 40, 36, 0) 19%, rgba(57, 40, 36, 0) 80%, rgba(57, 40, 36, .12) 100%);
        pointer-events: none;
      }

      .brand-mark {
        position: absolute;
        z-index: 3;
        top: 53px;
        right: 58px;
        width: 146px;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 1px 10px rgba(57, 40, 36, .14));
      }

      .eyebrow {
        position: absolute;
        z-index: 3;
        top: 74px;
        left: 72px;
        display: flex;
        align-items: center;
        gap: 13px;
        margin: 0;
        color: var(--puce);
        font: 700 17px/1 var(--body);
        letter-spacing: .16em;
        text-transform: uppercase;
      }
      .eyebrow::before { width: 37px; height: 1px; background: var(--cashmere); content: ""; }

      .copy {
        position: absolute;
        z-index: 3;
        left: 72px;
        bottom: 74px;
        width: 502px;
        color: var(--puce-dark);
      }
      h1 {
        max-width: 450px;
        margin: 0 0 18px;
        font: 400 58px/.94 var(--display);
        letter-spacing: -.055em;
      }
      .headline-count {
        display: inline-block;
        transform: translateY(-8px);
        margin-right: 0;
      }
      h2 {
        max-width: 470px;
        margin: 0;
        color: var(--puce);
        font: 400 30px/1.08 var(--display);
        letter-spacing: -.027em;
      }
      .support {
        width: 426px;
        margin: 27px 0 30px;
        color: #5f504c;
        font: 700 24px/1.38 var(--body);
        letter-spacing: -.012em;
      }
      .cta {
        display: inline-flex;
        min-height: 51px;
        align-items: center;
        padding: 0 23px;
        border: 1px solid rgba(121, 86, 77, .66);
        border-radius: 5px;
        color: var(--puce);
        font: 700 15px/1 var(--body);
        letter-spacing: .10em;
        text-transform: uppercase;
      }
      .rule {
        position: absolute;
        z-index: 3;
        right: 72px;
        bottom: 51px;
        width: 322px;
        height: 1px;
        background: rgba(121, 86, 77, .36);
      }
    </style>
  </head>
  <body>
    <main class="creative" aria-label="Anúncio Haven Clinic para ultrassom microfocado">
      <img class="portrait" src="./haven-ultrassom-microfocado-model-v1.png" alt="Mulher adulta com a mão apoiada suavemente na linha da mandíbula" />
      <div class="warm-wash" aria-hidden="true"></div>
      <p class="eyebrow">Estética avançada</p>
      <img class="brand-mark" src="../../brand/isologo01-web.png" alt="Haven Clinic — Clínica Integrada" />
      <section class="copy">
        <h1><span class="headline-count">3</span>&nbsp;BENEFÍCIOS DO ULTRASSOM MICROFOCADO PARA 40+</h1>
        <h2>PERDEU FIRMEZA DEPOIS<br />DOS 40?</h2>
        <p class="support">Conheça o ultrassom microfocado: tecnologia para estimular colágeno e redefinir o contorno facial.</p>
        <span class="cta">AGENDE SUA AVALIAÇÃO</span>
      </section>
      <div class="rule" aria-hidden="true"></div>
    </main>
  </body>
</html>
