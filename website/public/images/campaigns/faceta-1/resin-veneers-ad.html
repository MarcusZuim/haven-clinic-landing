<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Haven Clinic — Facetas de resina</title>
    <style>
      :root {
        --white-rock: #f1eee7;
        --puce: #79564d;
        --cashmere: #dec4ac;
        --dusty-grey: #817775;
        --puce-dark: #392824;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
      body { background: var(--white-rock); }

      .creative {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        isolation: isolate;
        background: var(--white-rock);
      }

      .background,
      .model {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .background { z-index: 0; }

      /* Official Haven isotipo: full background layer, intentionally occluded by the model. */
      .brand-depth {
        position: absolute;
        z-index: 1;
        top: 170px;
        left: -48px;
        width: 620px;
        height: 620px;
        object-fit: contain;
        opacity: .64;
        pointer-events: none;
      }

      .model { z-index: 2; }

      .brand-corner {
        position: absolute;
        z-index: 5;
        right: 72px;
        bottom: 54px;
        width: 150px;
        height: 150px;
        object-fit: contain;
        opacity: .9;
        filter: drop-shadow(0 3px 10px rgba(57, 40, 36, .12));
      }

      .top-wash {
        position: absolute;
        inset: 0;
        z-index: 3;
        background: linear-gradient(180deg, rgba(57, 40, 36, .18) 0%, rgba(57, 40, 36, 0) 22%);
      }

      .text-wash {
        position: absolute;
        inset: 0;
        z-index: 3;
        background: linear-gradient(180deg, rgba(241, 238, 231, 0) 43%, rgba(241, 238, 231, .55) 53%, var(--white-rock) 65%, var(--white-rock) 100%);
      }

      .content {
        position: absolute;
        z-index: 4;
        left: 74px;
        right: 74px;
        bottom: 80px;
        color: var(--puce-dark);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 13px;
        margin: 0 0 24px;
        color: var(--puce);
        font: 700 17px/1.1 Arial, Helvetica, sans-serif;
        letter-spacing: .17em;
        text-transform: uppercase;
      }
      .eyebrow::before { content: ""; width: 42px; height: 1px; background: var(--cashmere); }

      h1 {
        max-width: 800px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 82px;
        font-weight: 400;
        letter-spacing: -.045em;
        line-height: .98;
        color: var(--puce-dark);
      }

      .support {
        max-width: 780px;
        margin: 28px 0 34px;
        color: #665a57;
        font: 400 29px/1.38 Arial, Helvetica, sans-serif;
        letter-spacing: -.01em;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        min-height: 53px;
        padding: 0 24px;
        border: 1px solid rgba(121, 86, 77, .7);
        border-radius: 6px;
        color: var(--puce);
        font: 700 16px/1 Arial, Helvetica, sans-serif;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .footer-rule {
        position: absolute;
        z-index: 4;
        left: 74px;
        right: 74px;
        bottom: 41px;
        height: 1px;
        background: rgba(121, 86, 77, .28);
      }
    </style>
  </head>
  <body>
    <main class="creative" aria-label="Anúncio Haven Clinic para facetas de resina">
      <img class="background" src="./haven-resin-veneers-background-v1.png" alt="" aria-hidden="true" />
      <img class="brand-depth" src="../../brand/isotipo01-web.png" alt="" aria-hidden="true" />
      <img class="model" src="./haven-resin-veneers-model-cutout-v1.png" alt="Sorriso natural de uma mulher" />
      <div class="top-wash"></div>
      <div class="text-wash"></div>
      <section class="content">
        <p class="eyebrow">Facetas de resina</p>
        <h1>Seu novo sorriso começa aqui.</h1>
        <p class="support">Facetas de resina com naturalidade, leveza e proporção para valorizar sua beleza.</p>
        <span class="cta">Agende sua avaliação</span>
      </section>
      <div class="footer-rule"></div>
      <img class="brand-corner" src="../../brand/isotipo01-web.png" alt="" aria-hidden="true" />
    </main>
  </body>
</html>
